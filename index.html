<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FUNSTUFF | Merch K-Pop Orisinal by Coer</title>
  <meta name="description" content="Funstuff adalah toko merch K-Pop 100% In-House IP di Indonesia dengan stok siap kirim." />

  <!-- ============================================================
       GOOGLE ANALYTICS 4 (GA4)
       Ganti G-XXXXXXXXXX dengan Measurement ID GA4 kelompok lu!
       ============================================================ -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>
  <!-- ============================================================ -->

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { display: ['"Playfair Display"', 'serif'], sans: ['Poppins', 'sans-serif'] },
          colors: { brand: '#b5121b', maroon: '#7a1014', cream: '#fdf8f5', blush: '#fbd9de', butter: '#fff1c4', mint: '#d9f5e8', sky: '#dbeeff', ink: '#2b1719' },
          keyframes: { float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-14px)' } } },
          animation: { float: 'float 6s ease-in-out infinite' }
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html { scroll-behavior: smooth; }
    .nav-link { position: relative; padding: 4px 0; transition: color .2s; }
    .nav-link::after { content: ""; position: absolute; left: 0; bottom: -4px; height: 2px; width: 0; background: #b5121b; transition: width .25s; border-radius: 9999px; }
    .nav-link:hover::after, .nav-link.active::after { width: 100%; }
    .nav-link.active { color: #b5121b; }
    .btn-primary { background: #b5121b; color: #fff; box-shadow: 0 8px 20px -8px rgba(181,18,27,.6); transition: all .2s; }
    .btn-primary:hover { background: #9a0f17; transform: translateY(-2px); box-shadow: 0 12px 24px -8px rgba(181,18,27,.7); }
    .btn-ghost { background: #fff; border: 2px solid #f3c9cf; color: #7a1014; transition: all .2s; }
    .btn-ghost:hover { background: #fff3f5; border-color: #b5121b; }
    .fade-in { animation: fadeIn .5s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    input:focus, select:focus, textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(181,18,27,.15); border-color: #b5121b; }
  </style>
</head>

<body class="font-sans bg-cream text-ink min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-maroon/10 shadow-sm">
    <nav class="max-w-6xl mx-auto px-4 h-20 flex items-center justify-between">
      <a href="#/beranda" class="flex items-center gap-2 text-brand hover:scale-105 transition">
        <span class="text-3xl">🦊</span>
        <span class="font-display text-2xl font-black tracking-wide">FUNSTUFF</span>
      </a>
      <ul class="hidden md:flex items-center gap-7 text-sm font-medium text-maroon">
        <li><a href="#/beranda" data-nav="beranda" class="nav-link">Beranda</a></li>
        <li><a href="#/katalog" data-nav="katalog" class="nav-link">Katalog</a></li>
        <li><a href="#/tentang" data-nav="tentang" class="nav-link">Tentang</a></li>
        <li><a href="#/bantuan" data-nav="bantuan" class="nav-link">Bantuan</a></li>
      </ul>
      <div class="flex items-center gap-1">
        <a href="#/keranjang" class="relative p-2 rounded-lg border border-brand/70 text-brand hover:bg-blush/50 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8zM9 8V6a3 3 0 016 0v2"/></svg>
          <span id="cart-badge" class="hidden absolute -top-2 -right-2 bg-pink-500 text-white text-[10px] font-bold rounded-full min-w-[18px] px-1 text-center">0</span>
        </a>
        <a href="#/akun" class="p-2 rounded-full text-maroon hover:bg-blush/50 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        </a>
      </div>
    </nav>
  </header>

  <!-- KONTEN -->
  <main id="app" class="flex-1 w-full max-w-6xl mx-auto px-4 py-8"></main>

  <!-- FOOTER -->
  <footer class="bg-blush/40 border-t border-blush mt-16">
    <div class="max-w-6xl mx-auto px-4 py-12 grid md:grid-cols-4 gap-10 text-sm">
      <div>
        <p class="font-display text-2xl font-black text-brand">🦊 FUNSTUFF</p>
        <p class="mt-3 text-ink/70">Fanmerch K-Pop Eksklusif, Didesain Sepenuh Hati untuk Penggemar. 100% In-House IP.</p>
      </div>
      <div>
        <p class="font-bold text-brand uppercase mb-3">Menu</p>
        <ul class="space-y-2 text-ink/80">
          <li><a href="#/katalog" class="hover:text-brand">Katalog Produk</a></li>
          <li><a href="#/tentang" class="hover:text-brand">Cerita Kami</a></li>
        </ul>
      </div>
      <div>
        <p class="font-bold text-brand uppercase mb-3">Bantuan</p>
        <ul class="space-y-2 text-ink/80">
          <li><a href="#/bantuan" class="hover:text-brand">FAQ & Pengiriman</a></li>
          <li><a href="#/akun" class="hover:text-brand">Akun Saya</a></li>
        </ul>
      </div>
      <div>
        <p class="font-bold text-brand uppercase mb-3">Kontak</p>
        <!-- GANTI NOMOR WA DI BAWAH INI -->
        <a href="https://wa.me/6281234567890" target="_blank" class="btn-primary inline-block px-5 py-2.5 rounded-full text-xs font-semibold">Chat WA Admin</a>
      </div>
    </div>
  </footer>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-6 py-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50"></div>

<script>
/* ================= DATA & STATE ================= */
const PRODUCTS = [
  { id: 'p1', artist: 'CORTIS', name: 'Cortis Keychain Shaker (COTL Ver)', price: 80000, emoji: '🔑', grad: 'from-blush to-butter', status: 'Siap Kirim', desc: 'Gantungan kunci shaker 6x6cm akrilik bertema Coer dengan 5 pcs isian. 100% In-House Original IP.' },
  { id: 'p2', artist: 'ENHYPEN', name: 'Webbing Patch Strap', price: 55000, emoji: '🔖', grad: 'from-sky to-blush', status: 'Siap Kirim', desc: 'Strap webbing eksklusif dengan bordir patch premium untuk tas atau lightstick.' },
  { id: 'p3', artist: 'CORTIS', name: 'Cortis Shoe Charms Set', price: 65000, emoji: '👟', grad: 'from-butter to-mint', status: 'Pre-Order', desc: 'Set aksesoris sepatu (shoe charms) desain orisinal karakter Cortis. Bikin langkahmu makin imut!' },
  { id: 'p4', artist: 'CORTIS', name: 'Cortis Ball Plush', price: 75000, emoji: '🧸', grad: 'from-mint to-sky', status: 'Siap Kirim', desc: 'Boneka bola bulu lembut nan empuk. Varian: ACAI, REDRED, TNT.' }
];

let cart = JSON.parse(localStorage.getItem('funstuff_cart')) || [];
let currentUser = JSON.parse(localStorage.getItem('funstuff_user')) || null;
let recentOrder = null;
const SHIPPING_FEE = 18000;

const $ = s => document.querySelector(s);
const formatRp = n => 'Rp' + Number(n).toLocaleString('id-ID');
const inputCls = 'w-full rounded-xl border border-maroon/20 bg-white px-4 py-3 text-sm transition';

function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.remove('opacity-0'); t.classList.add('opacity-100');
  clearTimeout(t.timer);
  t.timer = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 2500);
}

function updateBadge() {
  const cnt = cart.reduce((s, c) => s + c.qty, 0);
  $('#cart-badge').textContent = cnt;
  $('#cart-badge').classList.toggle('hidden', cnt === 0);
  localStorage.setItem('funstuff_cart', JSON.stringify(cart));
}

/* ================= HALAMAN ================= */
function renderHome() {
  return `
  <section class="fade-in bg-blush/40 rounded-[2rem] p-10 md:p-16 flex flex-col md:flex-row items-center gap-10">
    <div class="flex-1">
      <span class="bg-white px-3 py-1 rounded-full text-xs font-bold text-brand uppercase tracking-widest">100% In-House IP</span>
      <h1 class="font-display text-4xl md:text-6xl font-black mt-4 text-maroon leading-tight">Fanmerch K-Pop Eksklusif.</h1>
      <p class="mt-4 text-ink/70">Didesain sepenuh hati untuk penggemar. Kualitas premium, bukan cetak ulang pasaran.</p>
      <a href="#/katalog" class="btn-primary inline-block mt-8 px-8 py-3 rounded-full font-bold">Mulai Belanja</a>
    </div>
    <div class="text-[10rem] animate-float">🧸</div>
  </section>`;
}

function renderCatalog() {
  return `
  <section class="fade-in">
    <h1 class="font-display text-3xl font-bold text-maroon mb-6">Katalog Produk</h1>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
      ${PRODUCTS.map(p => `
        <div class="bg-white rounded-2xl p-4 border border-maroon/10 shadow-sm hover:shadow-lg transition flex flex-col">
          <div class="aspect-square rounded-xl bg-gradient-to-br ${p.grad} flex items-center justify-center text-6xl">${p.emoji}</div>
          <span class="text-[10px] font-bold text-brand mt-3 uppercase tracking-wider">${p.artist}</span>
          <h3 class="font-bold text-sm mt-1 leading-snug flex-1">${p.name}</h3>
          <p class="font-bold text-brand mt-2">${formatRp(p.price)}</p>
          <button onclick="addToCart('${p.id}')" class="btn-primary w-full mt-3 py-2 rounded-full text-xs font-bold">+ Keranjang</button>
        </div>
      `).join('')}
    </div>
  </section>`;
}

function renderCart() {
  if (!cart.length) return `<div class="text-center py-20 fade-in"><div class="text-7xl">🛒</div><h2 class="mt-4 font-bold text-xl">Keranjang Kosong</h2><a href="#/katalog" class="text-brand hover:underline mt-2 inline-block">Belanja yuk!</a></div>`;
  
  const subtotal = cart.reduce((s, c) => s + (PRODUCTS.find(p=>p.id===c.id).price * c.qty), 0);
  return `
  <section class="fade-in max-w-4xl mx-auto">
    <h1 class="font-display text-3xl font-bold text-maroon mb-6">Keranjang</h1>
    <div class="bg-white rounded-2xl border border-maroon/10 p-6 shadow-sm mb-6">
      ${cart.map(c => {
        const p = PRODUCTS.find(x=>x.id===c.id);
        return `<div class="flex items-center gap-4 border-b border-maroon/10 py-4 last:border-0">
          <div class="w-16 h-16 rounded-lg bg-gradient-to-br ${p.grad} flex items-center justify-center text-3xl">${p.emoji}</div>
          <div class="flex-1"><p class="font-bold">${p.name}</p><p class="text-sm text-brand">${formatRp(p.price)} x ${c.qty}</p></div>
          <button onclick="removeFromCart('${c.id}')" class="text-maroon/50 hover:text-brand font-bold">✕</button>
        </div>`;
      }).join('')}
    </div>
    <div class="text-right">
      <p class="text-lg">Subtotal: <span class="font-bold text-brand">${formatRp(subtotal)}</span></p>
      <a href="#/checkout" class="btn-primary inline-block mt-4 px-10 py-3 rounded-full font-bold">Lanjut ke Pembayaran</a>
    </div>
  </section>`;
}

function renderCheckout() {
  if (!cart.length) { location.hash = '#/katalog'; return ''; }
  const subtotal = cart.reduce((s, c) => s + (PRODUCTS.find(p=>p.id===c.id).price * c.qty), 0);
  const total = subtotal + SHIPPING_FEE;

  return `
  <section class="fade-in max-w-5xl mx-auto grid md:grid-cols-2 gap-10">
    <div>
      <h1 class="font-display text-3xl font-bold text-maroon mb-6">Checkout</h1>
      <form id="checkout-form" class="space-y-4 bg-white p-6 rounded-2xl border border-maroon/10 shadow-sm">
        <div><label class="text-sm font-bold text-maroon">Nama Penerima</label><input type="text" name="name" required value="${currentUser?currentUser.name:''}" class="${inputCls}"></div>
        <div><label class="text-sm font-bold text-maroon">Nomor WhatsApp</label><input type="tel" name="phone" required class="${inputCls}"></div>
        <div><label class="text-sm font-bold text-maroon">Alamat Lengkap</label><textarea name="address" required class="${inputCls}" rows="3"></textarea></div>
        <div>
          <label class="text-sm font-bold text-maroon">Metode Pembayaran</label>
          <select name="payment" class="${inputCls}">
            <option value="QRIS">QRIS Otomatis (Bebas Biaya)</option>
            <option value="BCA">Transfer Bank BCA</option>
            <option value="Mandiri">Transfer Bank Mandiri</option>
            <option value="Gopay">E-Wallet (GoPay/OVO)</option>
          </select>
        </div>
        <button type="submit" class="btn-primary w-full py-3 mt-4 rounded-full font-bold text-lg">Buat Pesanan (${formatRp(total)})</button>
      </form>
    </div>
    <div class="bg-blush/20 p-6 rounded-2xl border border-blush h-fit">
      <h3 class="font-bold text-lg mb-4">Ringkasan Pesanan</h3>
      ${cart.map(c => {
        const p = PRODUCTS.find(x=>x.id===c.id);
        return `<div class="flex justify-between text-sm mb-2"><span>${p.name} (x${c.qty})</span><span>${formatRp(p.price*c.qty)}</span></div>`;
      }).join('')}
      <hr class="my-4 border-maroon/20">
      <div class="flex justify-between text-sm mb-2"><span>Subtotal</span><span>${formatRp(subtotal)}</span></div>
      <div class="flex justify-between text-sm mb-2"><span>Ongkos Kirim (Reguler)</span><span>${formatRp(SHIPPING_FEE)}</span></div>
      <div class="flex justify-between font-black text-brand text-lg mt-4 pt-4 border-t border-maroon/20"><span>Total Bayar</span><span>${formatRp(total)}</span></div>
    </div>
  </section>`;
}

function renderInvoice() {
  if (!recentOrder) { location.hash = '#/beranda'; return ''; }
  
  // GANTI NOMOR WA DI BAWAH INI
  const waAdmin = "6281234567890";
  const waText = encodeURIComponent(`Halo Admin Fun Stuff! Saya mau konfirmasi pesanan dengan nomor order *#${recentOrder.id}*.\n\nNama: ${recentOrder.name}\nTotal: ${formatRp(recentOrder.total)}\nMetode: ${recentOrder.payment}`);
  
  return `
  <section class="fade-in max-w-xl mx-auto text-center bg-white p-8 rounded-3xl border border-maroon/10 shadow-xl">
    <div class="text-6xl mb-4">✅</div>
    <h1 class="font-display text-3xl font-bold text-brand">Pesanan Berhasil!</h1>
    <p class="text-ink/60 mt-2">Terima kasih atas pesananmu. Berikut detail invoice kamu:</p>
    
    <div class="bg-cream p-5 rounded-2xl mt-6 text-left border border-maroon/10">
      <p class="text-sm text-ink/60">Nomor Pesanan</p>
      <p class="font-bold text-lg">#${recentOrder.id}</p>
      <hr class="my-3 border-maroon/10">
      <p class="text-sm text-ink/60">Total Pembayaran</p>
      <p class="font-black text-2xl text-brand">${formatRp(recentOrder.total)}</p>
      <p class="text-sm font-bold mt-2">Metode: ${recentOrder.payment}</p>
    </div>
    
    <p class="text-sm mt-6 mb-4 text-ink/80">Silakan klik tombol di bawah ini untuk konfirmasi pembayaran langsung ke WhatsApp Admin kami.</p>
    <a href="https://wa.me/${waAdmin}?text=${waText}" target="_blank" class="btn-primary block w-full py-3 rounded-full font-bold">📲 Konfirmasi via WhatsApp CS</a>
  </section>`;
}

function renderAccount() {
  if (currentUser) {
    return `
    <section class="fade-in max-w-md mx-auto text-center bg-white p-10 rounded-3xl shadow-sm border border-maroon/10">
      <div class="w-20 h-20 bg-blush rounded-full mx-auto flex items-center justify-center text-3xl">👤</div>
      <h1 class="font-bold text-2xl mt-4">Halo, ${currentUser.name}!</h1>
      <p class="text-ink/60">${currentUser.email}</p>
      <button onclick="logout()" class="btn-ghost w-full mt-8 py-2 rounded-full font-bold">Keluar Akun</button>
    </section>`;
  }

  return `
  <section class="fade-in max-w-md mx-auto bg-white p-8 rounded-3xl shadow-sm border border-maroon/10">
    <h1 class="font-display text-2xl font-bold text-maroon text-center mb-6">Login Akun Coer</h1>
    <form id="auth-form" class="space-y-4">
      <div><label class="text-sm font-bold text-maroon">Nama Lengkap</label><input type="text" name="name" required class="${inputCls}"></div>
      <div><label class="text-sm font-bold text-maroon">Email</label><input type="email" name="email" required class="${inputCls}"></div>
      <button type="submit" class="btn-primary w-full py-3 mt-2 rounded-full font-bold">Masuk / Daftar</button>
    </form>
  </section>`;
}

/* ================= LOGIC & EVENTS ================= */
function addToCart(id) {
  const item = cart.find(c => c.id === id);
  if (item) item.qty++; else cart.push({ id, qty: 1 });
  updateBadge();
  showToast('Ditambahkan ke keranjang!');
  const p = PRODUCTS.find(x=>x.id===id);
  gtag('event', 'add_to_cart', { currency: 'IDR', value: p.price, items: [{ item_id: p.id, item_name: p.name, price: p.price, quantity: 1 }] });
}

function removeFromCart(id) {
  cart = cart.filter(c => c.id !== id);
  updateBadge(); render();
}

function logout() {
  localStorage.removeItem('funstuff_user');
  currentUser = null;
  location.hash = '#/beranda';
}

const routes = { beranda: renderHome, katalog: renderCatalog, keranjang: renderCart, checkout: renderCheckout, invoice: renderInvoice, akun: renderAccount };
const app = $('#app');

function render() {
  const page = location.hash.replace(/^#\/?/, '') || 'beranda';
  app.innerHTML = (routes[page] || routes.beranda)();
  document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.dataset.nav === page));
  updateBadge();
}

window.addEventListener('hashchange', () => { window.scrollTo(0,0); render(); });

document.addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form));

  if (form.id === 'auth-form') {
    currentUser = { name: data.name, email: data.email };
    localStorage.setItem('funstuff_user', JSON.stringify(currentUser));
    showToast('Berhasil masuk!');
    location.hash = '#/akun';
  }
  
  if (form.id === 'checkout-form') {
    const subtotal = cart.reduce((s, c) => s + (PRODUCTS.find(p=>p.id===c.id).price * c.qty), 0);
    const total = subtotal + SHIPPING_FEE;
    const items = cart.map(c => {
      const p = PRODUCTS.find(x=>x.id===c.id);
      return { item_id: p.id, item_name: p.name, price: p.price, quantity: c.qty };
    });

    recentOrder = { id: 'FS-' + Date.now().toString().slice(-6), name: data.name, phone: data.phone, total: total, payment: data.payment, items };
    
    // TRACKING GA4: Event Purchase WAJIB untuk metrik E-Commerce
    gtag('event', 'purchase', {
      transaction_id: recentOrder.id,
      value: total,
      currency: 'IDR',
      shipping: SHIPPING_FEE,
      items: items
    });

    cart = []; updateBadge();
    location.hash = '#/invoice';
  }
});

render();
</script>
</body>
</html>
